services:
  db:
    image: postgres:16-alpine
    container_name: abadiy_xotira_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-abadiy_xotira_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - memorial_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abadiy_xotira_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?.env faylida DJANGO_SECRET_KEY ni kiriting}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      DJANGO_USE_HTTPS: ${DJANGO_USE_HTTPS:-False}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000}
      FRONTEND_PUBLIC_BASE_URL: ${FRONTEND_PUBLIC_BASE_URL:-http://localhost/m}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-abadiy_xotira_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd_2026}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    networks:
      - memorial_network
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abadiy_xotira_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Statik (admin CSS/JS) va yuklangan rasmlar nginx tomonidan to'g'ridan-to'g'ri beriladi
    volumes:
      - media_volume:/app/media:ro
      - static_volume:/app/staticfiles:ro
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - memorial_network

volumes:
  postgres_data:
    driver: local
  media_volume:
    driver: local
  static_volume:
    driver: local

networks:
  memorial_network:
    driver: bridge
