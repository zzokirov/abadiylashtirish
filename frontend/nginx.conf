upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Marhum fotosuratlarini yuklash uchun (standart 1 MB yetarli emas)
    client_max_body_size 10m;

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django'ga yo'naltirishda umumiy sarlavhalar
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ommaviy doimiy QR sahifa (qabr toshidagi QR shu manzilga olib keladi)
    location /m/ {
        proxy_pass http://django_backend;
    }

    # REST API
    location /api/ {
        proxy_pass http://django_backend;
    }

    # Django Admin paneli
    location /admin/ {
        proxy_pass http://django_backend;
    }

    # Django statik fayllari (admin CSS/JS) — collectstatic natijasi
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Yuklangan rasmlar
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML sahifalar keshlanmasligi shart (dinamik shajara uchun)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Vite xeshlangan resurslar
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
